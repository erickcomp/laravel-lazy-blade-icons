name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.3'
            laravel: '12'
            framework: '^12.60'
            testbench: '^10.0'
          - php: '8.3'
            laravel: '13'
            framework: '^13.10'
            testbench: '^11.0'
          - php: '8.4'
            laravel: '12'
            framework: '^12.60'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13'
            framework: '^13.10'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      # laravel/framework is pinned explicitly: constraining only testbench does
      # not hold the framework down (testbench ^10 resolves happily against
      # Laravel 13), which would silently run both matrix rows on the same version.
      - name: Install dependencies
        run: |
          composer update -W \
            --with="laravel/framework:${{ matrix.framework }}" \
            --with="orchestra/testbench:${{ matrix.testbench }}" \
            --prefer-dist --no-interaction --no-progress

      - name: Assert the intended Laravel version is installed
        run: |
          composer show laravel/framework | grep -E '^versions.*\*? v?${{ matrix.laravel }}\.'

      - name: Run tests
        run: vendor/bin/pest --colors=always

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: composer-phpstan-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
